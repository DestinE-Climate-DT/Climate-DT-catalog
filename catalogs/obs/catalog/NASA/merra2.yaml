sources:
  monthly-healpix:
    description: MERRA-2 monthly data from 1980 to 2023, HEALPix nested, online from DKRZ (WCRP hackathon)
    driver: zarr
    metadata:
      source_grid_name: hpz{{ zoom }}-nested
      fixer_name: MERRA2-healpix
    args:
      consolidated: true
      urlpath: https://swift.dkrz.de/v1/dkrz_41caca03ec414c2f95f52b23b775134f/reanalysis/v1/MERRA2_P1M_{{ zoom }}.zarr
    parameters:
      zoom:
        allowed: [7, 6, 5, 4, 3, 2, 1, 0]
        default: 7
        description: zoom resolution of the dataset
        type: int
