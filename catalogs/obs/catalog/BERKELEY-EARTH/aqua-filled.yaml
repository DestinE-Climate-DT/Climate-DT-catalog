plugins:
  source:
    - module: intake_xarray

sources:
  r100-monthly-v1:
    description: Global Monthly Surface Temperature from Berkeley Earth (1979-2024) 1x1 deg - older version
    driver: netcdf
    metadata:
      source_grid_name: lon-lat
    args:
      urlpath: '{{DVC_PATH}}/BERKELEY-EARTH/aqua-filled/Berkeley-Earth_aqua-filled_1x1_1979-2024.nc'
      chunks: {}
      xarray_kwargs:
        decode_times: True
  r100-monthly:
    description: Global Monthly Surface Temperature from Berkeley Earth (1979-2026) 1x1 deg - Beta product at 1x1 deg resolution
    driver: netcdf
    metadata:
      source_grid_name: lon-lat
    args:
      urlpath: '{{DVC_PATH}}/BERKELEY-EARTH/aqua-filled/Berkeley-Earth_aqua-filled_1x1_1979-2026.nc'
      chunks: {}
      xarray_kwargs:
        decode_times: True
  r025-monthly:
    description: Global Monthly Surface Temperature from Berkeley Earth (1979-2026) 0.25x0.25 deg - Beta product at high resolution
    driver: netcdf
    metadata:
      source_grid_name: lon-lat
    args:
      urlpath: '{{DVC_PATH}}/BERKELEY-EARTH/aqua-filled/Berkeley-Earth_aqua-filled_0.25x0.25_1979-2026.nc'
      chunks: {}
      xarray_kwargs:
        decode_times: True

