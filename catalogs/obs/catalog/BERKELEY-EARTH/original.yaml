sources:
  r100-monthly:
    description: Global Monthly Surface Temperature from Berkeley Earth (1850-2026) 1x1 deg - original, gaps not filled
    driver: netcdf
    metadata:
      source_grid_name: lon-lat-skipna
    args:
      urlpath: '{{DVC_PATH}}/BERKELEY-EARTH/original/r100-monthly/Berkeley-Earth_original_1x1_185001-202609.nc'
      chunks:
        latitude: -1
        longitude: -1
        time: 517
      xarray_kwargs:
        decode_times: true
  r025-monthly:
    description: Global Monthly Surface Temperature from Berkeley Earth (1850-2026) 0.25x0.25 deg - original, gaps not filled
    driver: netcdf
    metadata:
      source_grid_name: lon-lat-skipna
    args:
      urlpath: '{{DVC_PATH}}/BERKELEY-EARTH/original/r025-monthly/Berkeley-Earth_original_0.25x0.25_185001-202609.nc'
      chunks:
        latitude: -1
        longitude: -1
        time: 32
      xarray_kwargs:
        decode_times: true
