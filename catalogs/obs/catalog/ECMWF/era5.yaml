sources:
  monthly-zarr: &monthly-zarr
    description: ERA5 monthly data from 1940 to 2024 in zarr
    driver: zarr
    metadata:
      source_grid_name: era5-r025s
      fixer_name: ERA5-destine-v1
    args:
      consolidated: True
      urlpath: '{{DATA_PATH}}/ERA5/zarr/era5_monthly_1940-2024.zarr'
      chunks:
        time: 12

  monthly-netcdf: &monthly-netcdf
    description: ERA5 monthly data from 1940 to 2025 in netcdf
    driver: netcdf
    metadata:
      source_grid_name: era5-r025s
      fixer_name: ERA5-destine-v2
    args:
      urlpath: '{{DVC_PATH}}/ERA5/mon/ERA5_*_mon_full*.nc'
      chunks: 
        time: 12
      xarray_kwargs:
        decode_times: True

  monthly:
    <<: *monthly-netcdf

  daily:
    description: ERA5 daily data from 1940 to 2022 (test)
    driver: netcdf
    metadata:
      source_grid_name: era5-r025s
      fixer_name: ERA5-daily-destine-v1
    args:
      urlpath: '{{DATA_PATH}}/ERA5/day/ERA5_*_day_full*.nc'
      chunks: 
        time: 30
      xarray_kwargs:
        decode_times: True

  monthly-healpix:
    description: ERA5 monthly data from 1940 to 2023, HEALPix nested, online from DKRZ (WCRP hackathon)
    driver: zarr
    metadata:
      source_grid_name: hpz{{ zoom }}-nested
      fixer_name: ERA5-healpix
    args:
      consolidated: true
      urlpath: https://swift.dkrz.de/v1/dkrz_41caca03ec414c2f95f52b23b775134f/reanalysis/v1/ERA5_P1M_{{ zoom }}.zarr
    parameters:
      zoom:
        allowed: [8, 7, 6, 5, 4, 3, 2, 1, 0]
        default: 7
        description: zoom resolution of the dataset
        type: int
