sources:
  era5:
    description: AQUA compact version of ERA5 data
    driver: yaml_file_cat
    args:
        path: "{{CATALOG_DIR}}/era5.yaml"
  google-era5:
    description: ERA5 hourly data from with ARCO ERA5 Google cloud
    driver: yaml_file_cat
    args:
        path: "{{CATALOG_DIR}}/google-era5.yaml"
  earthhub-era5:
    description: ERA5 hourly data from with ARCO Earth Data Hub Google cloud
    driver: yaml_file_cat
    args:
        path: "{{CATALOG_DIR}}/earthhub-era5.yaml"
  cds-era5:
    description: ERA5 hourly data from with ARCO Earth Data Hub Google cloud
    driver: yaml_file_cat
    args:
        path: "{{CATALOG_DIR}}/cds-era5.yaml"
  era5-land:
    description: ERA5-Land monthly data on the native 0.1 degree grid
    driver: yaml_file_cat
    args:
        path: "{{CATALOG_DIR}}/era5-land.yaml"
