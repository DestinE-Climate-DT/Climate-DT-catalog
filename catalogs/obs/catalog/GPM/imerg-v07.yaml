sources:
  monthly:
    description: IMERG V07 Final monthly precipitation 0.1deg from 1998 to 2024
    driver: netcdf
    metadata:
      source_grid_name: lon-lat
    args:
      urlpath: '{{DVC_PATH}}/GPM/imerg-v07/monthly/IMERG_V07_monthly_*.nc'
      chunks: {}
      xarray_kwargs:
        decode_times: True
        data_vars: minimal  # do not concatenate lat_bnds/lon_bnds along time
