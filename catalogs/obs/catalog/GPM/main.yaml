sources:
  imerg:
    description: Integrated Multi-satellitE Retrievals for GPM
    driver: yaml_file_cat
    args:
        path: "{{CATALOG_DIR}}/imerg.yaml"
  imerg-v07:
    description: GPM IMERG V07 Final run precipitation, from NASA GES DISC
    driver: yaml_file_cat
    args:
        path: "{{CATALOG_DIR}}/imerg-v07.yaml"

  ir-imerg:
    description: Merged NCEP/CPC IR brightness temperature and IMERG V07B precipitation on HEALPix
    driver: yaml_file_cat
    args:
        path: "{{CATALOG_DIR}}/ir-imerg.yaml"
