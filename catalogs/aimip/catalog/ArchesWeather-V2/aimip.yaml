sources:
  monthly-atm2d:
    description: monthly 2D data on the gn grid (psl, tas, tos, uas, vas, zg)
    driver: netcdf
    metadata:
      source_grid_name: lon-lat
    args:
      urlpath:
      - '{{AIMIP_PATH}}/ArchesWeather/ArchesWeather-V2/aimip/{{realization}}/Amon/psl/gn/psl_*_gn_*.nc'
      - '{{AIMIP_PATH}}/ArchesWeather/ArchesWeather-V2/aimip/{{realization}}/Amon/tas/gn/tas_*_gn_*.nc'
      - '{{AIMIP_PATH}}/ArchesWeather/ArchesWeather-V2/aimip/{{realization}}/Amon/tos/gn/tos_*_gn_*.nc'
      - '{{AIMIP_PATH}}/ArchesWeather/ArchesWeather-V2/aimip/{{realization}}/Amon/uas/gn/uas_*_gn_*.nc'
      - '{{AIMIP_PATH}}/ArchesWeather/ArchesWeather-V2/aimip/{{realization}}/Amon/vas/gn/vas_*_gn_*.nc'
      - '{{AIMIP_PATH}}/ArchesWeather/ArchesWeather-V2/aimip/{{realization}}/Amon/zg/gn/zg_*_gn_*.nc'
      chunks:
        time: 12
      xarray_kwargs:
        decode_times: true
        combine: by_coords
        compat: override
        coords: minimal
        data_vars: minimal
    parameters:
      realization:
        description: ensemble member
        type: str
        default: r1i1p1f1
        allowed:
        - r1i1p1f1
        - r2i1p1f1
        - r3i1p1f1
        - r4i1p1f1
        - r5i1p1f1
  monthly-atm3d:
    description: monthly 3D data on the gn grid (hus, ta, ua, va)
    driver: netcdf
    metadata:
      source_grid_name: lon-lat
