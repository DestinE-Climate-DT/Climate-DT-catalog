sources:
  monthly-atm2d:
    description: monthly 2D data on the gn grid (huss, pr, ps, tas, ts, uas, vas)
    driver: netcdf
    metadata:
      source_grid_name: lon-lat
    args:
      urlpath:
      - '{{AIMIP_PATH}}/Ai2/ACE2-1-ERA5/aimip-p2k/{{realization}}/Amon/huss/gn/v20251130/huss_*_gn_*.nc'
      - '{{AIMIP_PATH}}/Ai2/ACE2-1-ERA5/aimip-p2k/{{realization}}/Amon/pr/gn/v20251130/pr_*_gn_*.nc'
      - '{{AIMIP_PATH}}/Ai2/ACE2-1-ERA5/aimip-p2k/{{realization}}/Amon/ps/gn/v20251130/ps_*_gn_*.nc'
      - '{{AIMIP_PATH}}/Ai2/ACE2-1-ERA5/aimip-p2k/{{realization}}/Amon/tas/gn/v20251130/tas_*_gn_*.nc'
      - '{{AIMIP_PATH}}/Ai2/ACE2-1-ERA5/aimip-p2k/{{realization}}/Amon/ts/gn/v20251130/ts_*_gn_*.nc'
      - '{{AIMIP_PATH}}/Ai2/ACE2-1-ERA5/aimip-p2k/{{realization}}/Amon/uas/gn/v20251130/uas_*_gn_*.nc'
      - '{{AIMIP_PATH}}/Ai2/ACE2-1-ERA5/aimip-p2k/{{realization}}/Amon/vas/gn/v20251130/vas_*_gn_*.nc'
      chunks:
        time: 12
      xarray_kwargs:
        decode_times: true
        combine: by_coords
        compat: override
        coords: minimal
        data_vars: minimal
    parameters:
      realization:
        description: ensemble member
        type: str
        default: r1i1p1f1
        allowed:
        - r1i1p1f1
        - r2i1p1f1
        - r3i1p1f1
        - r4i1p1f1
        - r5i1p1f1
  monthly-atm3d-native:
    description: monthly 3D data on the gn grid (hus, ta, ua, va)
    driver: netcdf
    metadata:
      source_grid_name: lon-lat
    args:
