      - '{{AIMIP_PATH}}/NVIDIA/CMIP6/AIMIP/NVIDIA/cBottle-1-3/aimip-p2k/{{realization}}/Amon/zg/gn/v20260323/zg_*_gn_*.nc'
      chunks:
        time: 12
      xarray_kwargs:
        decode_times: true
        combine: by_coords
        compat: override
        coords: minimal
        data_vars: minimal
        drop_variables: *id001
    parameters:
      realization:
        description: ensemble member
        type: str
        default: r1i1p4f1
        allowed:
        - r1i1p4f1
