sources:
  monthly-atm2d-native:
    description: monthly 2D data on the gn grid (huss, pr, ps, tas, ts, uas, vas)
    driver: netcdf
    metadata:
      source_grid_name: lon-lat
    args:
      urlpath:
      - '{{AIMIP_PATH}}/MPI-M/MPI-ESM1-2-LR/aimip/{{realization}}/Amon/huss/gn/v20190815/huss_*_gn_*.nc'
      - '{{AIMIP_PATH}}/MPI-M/MPI-ESM1-2-LR/aimip/{{realization}}/Amon/pr/gn/v20190815/pr_*_gn_*.nc'
      - '{{AIMIP_PATH}}/MPI-M/MPI-ESM1-2-LR/aimip/{{realization}}/Amon/ps/gn/v20190815/ps_*_gn_*.nc'
      - '{{AIMIP_PATH}}/MPI-M/MPI-ESM1-2-LR/aimip/{{realization}}/Amon/tas/gn/v20190815/tas_*_gn_*.nc'
      - '{{AIMIP_PATH}}/MPI-M/MPI-ESM1-2-LR/aimip/{{realization}}/Amon/ts/gn/v20190815/ts_*_gn_*.nc'
      - '{{AIMIP_PATH}}/MPI-M/MPI-ESM1-2-LR/aimip/{{realization}}/Amon/uas/gn/v20190815/uas_*_gn_*.nc'
      - '{{AIMIP_PATH}}/MPI-M/MPI-ESM1-2-LR/aimip/{{realization}}/Amon/vas/gn/v20190815/vas_*_gn_*.nc'
      chunks:
        time: 12
      xarray_kwargs:
        decode_times: true
        combine: by_coords
        compat: override
        coords: minimal
        data_vars: minimal
    parameters:
      realization:
        description: ensemble member
        type: str
        default: r1i1p1f1
        allowed:
        - r1i1p1f1
  monthly-atm3d-native:
