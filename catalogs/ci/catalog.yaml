metadata:
  parameters:
    TEST_PATH:
      type: str
      description: the path to test datasets
      default: '.'
    FDB_HOME:
      type: str
      description: the path to the FDB installation
      default: '/app'

sources:
  CMCC:
    description: CMCC climate model
    driver: yaml_file_cat
    args:
      path: "{{CATALOG_DIR}}/catalog/CMCC/main.yaml"
  FESOM:
    description: FESOM ocean model
    driver: yaml_file_cat
    args:
      path: "{{CATALOG_DIR}}/catalog/FESOM/main.yaml"
  IFS:
    description: IFS atmospheric model
    driver: yaml_file_cat
    args:
      path: "{{CATALOG_DIR}}/catalog/IFS/main.yaml"
  ICON:
    description: ICON atmospheric model
    driver: yaml_file_cat
    args:
      path: "{{CATALOG_DIR}}/catalog/ICON/main.yaml"
  NEMO:
    description: NEMO oceanic model
    driver: yaml_file_cat
    args:
      path: "{{CATALOG_DIR}}/catalog/NEMO/main.yaml"
  ERA5:
    description: ERA5
    driver: yaml_file_cat
    args:
      path: "{{CATALOG_DIR}}/catalog/ERA5/main.yaml"
  ECE4-FAST:
    description: ECE4-FAST tuning coupled run
    driver: yaml_file_cat
    args:
      path: "{{CATALOG_DIR}}/catalog/ECE4-FAST/main.yaml"
  stac-ifs:
    description: IFS test data through the local STAC collection
    driver: stac
    args:
      urlpath: tests/stac_catalogue/collections/ifs.json
      item: ifs-long-regridded-r18x9
      asset: data
      chunks:
        time: 12
      xarray_kwargs:
        engine: netcdf4
    metadata:
      source_grid_name:
        ifs-long-regridded-r18x9: lon-lat
        ifs-short-ifs2d-tco79: tco79
      fixer_name:
        ifs-long-regridded-r18x9: ifs-ci-test
  stac-ifs-items:
    description: Individually configured IFS STAC items
    driver: yaml_file_cat
    args:
      path: "{{CATALOG_DIR}}/catalog/STAC/ifs-items.yaml"
