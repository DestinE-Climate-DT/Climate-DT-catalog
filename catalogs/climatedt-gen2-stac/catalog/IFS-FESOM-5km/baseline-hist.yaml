        model: ifs-fesom
        realization: 1
        resolution: high
        expver: 0001  # To be overwritten by workflow/config file
        type: fc
        stream: clte
        date: 19900101
        time: 0000
        param: 131
        levtype: hl
        levelist: [100]
      data_start_date: 19900101T0000
      data_end_date: 20141231T2300
      chunks: D
      savefreq: h
      timestep: h
      timestyle: date
    description: STAC-derived catalog entry for hourly-hpz10-hl (ifs-fesom, 
      hist)
    driver: gsv
    metadata:
      variables: [131, 132]
      source_grid_name: hpz10
      fixer_name: climatedt-phase2-production
