name: Generate STAC Catalogs with AQUA

on:
    schedule:
        - cron: "0 3 * * 1" # run every Monday at 03:00 UTC
    workflow_dispatch:
        inputs:
            models:
                description: 'JSON array of models to process (e.g. ["icon", "ifs-fesom"])'
                required: false
                default: '["icon"]'
                type: string
            activities:
                description: 'JSON array of activities to process (e.g. ["baseline", "projections"])'
                required: false
                default: '["baseline"]'
                type: string
            aqua_branch:
                description: 'AQUA repository branch to use'
                required: false
                default: 'stac-catgen'
                type: string

permissions:
    contents: write
    pull-requests: write

defaults:
    run:
        shell: bash -l -eo pipefail {0}

jobs:
    stacgen_and_pr:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Climate-DT-catalog repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Checkout AQUA repository
              uses: actions/checkout@v7
              with:
                  repository: DestinE-Climate-DT/AQUA
                  ref: ${{ inputs.aqua_branch || 'stac-catgen' }}
                  path: AQUA

            - name: Setup Micromamba environment
              uses: mamba-org/setup-micromamba@v3
              with:
                  environment-file: AQUA/environment.yml
                  cache-environment: true
                  cache-downloads: true

            - name: Install AQUA
              run: |
                    cd AQUA
                    pip install -e .

            - name: Set up AQUA
              run: |
                  # Initialize AQUA catalogs in $HOME/.aqua
                  aqua -vv install github

            - name: Set up Polytope Key
              run: |
                  # Set up polytope secrets
                  cat >$HOME/.polytopeapirc << EOF
                  {
                    "user_key": "${{ secrets.POLYTOPE_KEY }}"
                  }
                  EOF

            - name: Generate STAC catalogs for all models/activities
              env:
                  MODELS_INPUT: ${{ inputs.models }}
                  ACTIVITIES_INPUT: ${{ inputs.activities }}
              run: |
                  echo "==========================================="
                  echo "Generating STAC catalogs"
                  echo "==========================================="

                  # Use defaults if not provided (falls through on schedule triggers too,
                  # since inputs.* is empty on non-workflow_dispatch events)
                  MODELS="${MODELS_INPUT:-'["icon"]'}"
                  ACTIVITIES="${ACTIVITIES_INPUT:-'["baseline"]'}"
                  [ -z "$MODELS" ] && MODELS='["icon"]'
                  [ -z "$ACTIVITIES" ] && ACTIVITIES='["baseline"]'

                  echo "Models: $MODELS"
                  echo "Activities: $ACTIVITIES"

                  TOTAL_MODELS=$(echo "$MODELS" | jq 'length')
                  TOTAL_ACTIVITIES=$(echo "$ACTIVITIES" | jq 'length')
                  TOTAL=$((TOTAL_MODELS * TOTAL_ACTIVITIES))
                  COUNT=0
                  FAILED=()

                  # Generate for each combination
                  for model in $(echo "$MODELS" | jq -r '.[]'); do
                    for activity in $(echo "$ACTIVITIES" | jq -r '.[]'); do
                      # NOTE: use arithmetic expansion, not ((COUNT++)) -- the latter
                      # evaluates to the pre-increment value (0 on the first pass),
                      # which `set -e` treats as a failing command and kills the script.
                      COUNT=$((COUNT + 1))
                      echo ""
                      echo "[$COUNT/$TOTAL] Generating: $model - $activity"

                      # Don't let one failing combination abort the rest of the run.
                      if ! aqua -vv stacgen --model "$model" --activity "$activity" --output ./; then
                        echo "⚠️  FAILED: $model - $activity"
                        FAILED+=("$model/$activity")
                      fi
                    done
                  done

                  echo ""
                  echo "==========================================="
                  if [ ${#FAILED[@]} -eq 0 ]; then
                    echo "✅ All STAC generation completed successfully"
                  else
                    echo "⚠️  STAC generation finished with failures:"
                    printf '  - %s\n' "${FAILED[@]}"
                  fi
                  echo "==========================================="

                  # Fail the step (after doing all the work) if anything failed,
                  # so the run is still flagged red in the Actions UI.
                  if [ ${#FAILED[@]} -ne 0 ]; then
                    exit 1
                  fi

            - name: Check for changes
              id: check
              run: |
                  echo "=== GIT STATUS BEFORE ADD ==="
                  git status --short

                  # Guard against `catalogs/` not existing (e.g. if stacgen wrote
                  # elsewhere) so `git add` doesn't error out under set -e.
                  if [ -d catalogs ]; then
                    git add catalogs/
                  else
                    echo "⚠️  'catalogs/' directory not found -- checking for other changes"
                    git add -A
                  fi

                  echo ""
                  echo "=== GIT STATUS AFTER ADD ==="
                  git status --short

                  if git diff --cached --quiet; then
                    echo "has_changes=false" >> $GITHUB_OUTPUT
                    echo "❌ No changes detected"
                  else
                    echo "has_changes=true" >> $GITHUB_OUTPUT
                    echo "✅ Changes detected:"
                    git diff --cached --name-status | head -30
                  fi

            - name: Create Pull Request
              if: ${{ steps.check.outputs.has_changes == 'true' }}
              uses: peter-evans/create-pull-request@v8
              with:
                  token: ${{ secrets.STACGEN_TOKEN }}
                  branch: stacgen-update-${{ github.run_number }}
                  base: main
                  commit-message: |
                      chore: update STAC catalogs via stacgen [automated]

                      Models: ${{ inputs.models || '["icon"]' }}
                      Activities: ${{ inputs.activities || '["baseline"]' }}
                      AQUA branch: ${{ inputs.aqua_branch || 'stac-catgen' }}

                      Generated by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  title: "Update STAC catalogs with AQUA stacgen"
                  body: |
                      ## 🤖 Automated STAC Catalog Update

                      **Run ID**: ${{ github.run_id }}
                      **AQUA branch**: `${{ inputs.aqua_branch || 'stac-catgen' }}`
                      **Models processed**: ${{ inputs.models || '["icon"]' }}
                      **Activities processed**: ${{ inputs.activities || '["baseline"]' }}

                      ### Commands executed

                      For each model/activity combination:
                      ```bash
                      aqua -vv stacgen --model <model> --activity <activity>
                      ```

                      ### Workflow details

                      - 🔗 [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
                      - ⏰ Triggered: ${{ github.event_name }}

                      ---

                      ⚠️ **Please review the generated catalogs before merging**

                      - [ ] Generated YAML files are syntactically correct
                      - [ ] Catalog structure is as expected
                      - [ ] No sensitive information was accidentally committed
                      - [ ] Data references are valid
                  labels: |
                      automated
                      stac-generation
                  delete-branch: true
                  committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

            - name: Summary
              if: always()
              run: |
                  if [ "${{ steps.check.outputs.has_changes }}" = "true" ]; then
                    echo "✅ PR created successfully"
                    echo "Branch: stacgen-update-${{ github.run_number }}"
                  else
                    echo "ℹ️ No changes detected - skipping PR creation"
                  fi